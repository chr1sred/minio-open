captainVersion: 4
# MinIO Open - template One-Click para CapRover
#
# Como usar: CapRover > Apps > One-Click Apps/Databases > role ate o fim >
# ">> TEMPLATE <<" > cole TODO este arquivo > Next.
#
# Cria dois apps:
#   <nome>          API S3 (porta 9000)  -> https://<nome>.<seu-dominio>
#   <nome>-console  Console admin        -> https://<nome>-console.<seu-dominio>
services:
    $$cap_appname:
        image: $$cap_minio_image
        restart: always
        volumes:
            - $$cap_appname-data:/data
        environment:
            MINIO_ROOT_USER: $$cap_root_user
            MINIO_ROOT_PASSWORD: $$cap_root_password
            MINIO_SERVER_URL: https://$$cap_appname.$$cap_root_domain
            MINIO_BROWSER_REDIRECT_URL: https://$$cap_appname-console.$$cap_root_domain
            MINIO_CONSOLE_LOCAL_API: 'on'
            MINIO_MEMLIMIT: $$cap_memlimit
            MINIO_SCANNER_SPEED: slow
            MINIO_UPDATE: 'off'
            MINIO_INIT_BUCKETS: $$cap_bucket
            MINIO_INIT_PUBLIC_PATHS: $$cap_bucket/public
            MINIO_INIT_APP_USER: $$cap_app_user
            MINIO_INIT_APP_PASSWORD: $$cap_app_password
        caproverExtra:
            containerHttpPort: '9000'
    $$cap_appname-console:
        depends_on:
            - $$cap_appname
        restart: always
        caproverExtra:
            containerHttpPort: '80'
            websocketSupport: 'true'
            dockerfileLines:
                # Proxy minimo (~3 MB RAM) que publica o console (porta 9001) do app principal.
                - FROM nginx:1.28-alpine
                - RUN echo 'map $http_upgrade $connection_upgrade { default upgrade; "" close; } server { listen 80; client_max_body_size 0; proxy_buffering off; proxy_request_buffering off; resolver 127.0.0.11 valid=10s ipv6=off; set $console http://srv-captain--$$cap_appname:9001; location / { proxy_pass $console; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 1h; proxy_send_timeout 1h; } }' > /etc/nginx/conf.d/default.conf
caproverOneClickApp:
    variables:
        - id: $$cap_minio_image
          label: Imagem Docker do MinIO Open
          defaultValue: ghcr.io/chr1sred/minio-open:latest
          description: Imagem publicada pelo GitHub Actions deste fork (workflow "MinIO Open image").
        - id: $$cap_root_user
          label: Usuario admin (MINIO_ROOT_USER)
          defaultValue: admin
          validRegex: /^[a-zA-Z0-9_.-]{3,64}$/
        - id: $$cap_root_password
          label: Senha admin (MINIO_ROOT_PASSWORD)
          defaultValue: $$cap_gen_random_hex(32)
          description: Minimo 8 caracteres. Guarde-a! E o login do console.
          validRegex: /^[a-zA-Z0-9_.-]{8,128}$/
        - id: $$cap_bucket
          label: Bucket do Typebot
          defaultValue: typebot
          description: Sera criado automaticamente com a pasta public/ liberada para leitura anonima.
          validRegex: /^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$/
        - id: $$cap_app_user
          label: Usuario S3 dedicado ao Typebot (S3_ACCESS_KEY)
          defaultValue: typebot
          validRegex: /^[a-zA-Z0-9_.-]{3,64}$/
        - id: $$cap_app_password
          label: Senha S3 do Typebot (S3_SECRET_KEY)
          defaultValue: $$cap_gen_random_hex(40)
          validRegex: /^[a-zA-Z0-9_.-]{8,128}$/
        - id: $$cap_memlimit
          label: Limite de memoria do MinIO (MINIO_MEMLIMIT)
          defaultValue: 1GiB
          description: Em VPS de 4 GB, 1GiB deixa folga para Typebot, Postgres e Redis.
    instructions:
        start: >-
            MinIO Open: armazenamento S3 com console admin COMPLETO (usuarios, grupos, politicas,
            lifecycle, eventos, replicacao, tiers, configuracoes), ja pronto para o Typebot.
            Antes de continuar, garanta que a imagem existe (GitHub > Actions > "MinIO Open image").
        end: >-
            Pronto! Agora:
            (1) Abra o app $$cap_appname > HTTP Settings > Enable HTTPS e marque "Force HTTPS".
            (2) Faca o mesmo no app $$cap_appname-console.
            (3) Console: https://$$cap_appname-console.$$cap_root_domain (usuario $$cap_root_user).
            (4) No Typebot (builder e viewer) adicione:
            S3_ACCESS_KEY=$$cap_app_user ,
            S3_SECRET_KEY=$$cap_app_password ,
            S3_BUCKET=$$cap_bucket ,
            S3_ENDPOINT=$$cap_appname.$$cap_root_domain ,
            S3_SSL=true , S3_REGION=us-east-1 .
            Os mesmos valores aparecem nos logs do app $$cap_appname.
    displayName: MinIO Open (console completo + Typebot)
    isOfficial: false
    description: MinIO com o console administrativo completo restaurado, leve e configurado automaticamente para o Typebot.
    documentation: https://github.com/chr1sred/minio-open/blob/master/deploy/README.md
