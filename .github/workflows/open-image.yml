name: MinIO Open image

# Compila a imagem Docker deste fork (Dockerfile.open) e publica em
# ghcr.io/<dono>/minio-open. Assim o CapRover so baixa a imagem pronta,
# sem gastar CPU/RAM da VPS compilando Go.

on:
  push:
    branches:
      - open
      - 'claude/**'
    tags:
      - 'open-*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Plataformas (ex.: linux/amd64,linux/arm64)'
        default: 'linux/amd64'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: contains(github.event.inputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/minio-open
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - id: date
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.open
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MINIO_BUILD_DATE=${{ steps.date.outputs.now }}
            MINIO_COMMIT=${{ github.sha }}
            BUILD_JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max
